<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>NoteQuest – carnet de donjon</title>
  <meta name="theme-color" content="#f6f1e3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NoteQuest">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="entete">
      <h1>NoteQuest</h1>
      <div id="resume"></div>
    </header>

    <main id="vues">
      <section id="vue-carte" class="vue">
        <div id="carte-zone">
          <svg id="carte" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="carte-vide" class="carte-vide"></div>
          <div class="carte-outils">
            <button id="btn-recentrer" title="Recentrer">⌖</button>
            <button id="btn-zoom-plus" title="Zoom avant">+</button>
            <button id="btn-zoom-moins" title="Zoom arrière">−</button>
          </div>
          <div id="alerte-tenebres" class="alerte" hidden>Plus de torche : les ténèbres vous guettent.</div>
        </div>
      </section>

      <section id="vue-panneau" class="vue panneau">
        <div id="onglet-perso" class="onglet"></div>
        <div id="onglet-segment" class="onglet" hidden></div>
        <div id="onglet-journal" class="onglet" hidden></div>
        <div id="onglet-regles" class="onglet" hidden></div>
        <div id="onglet-plus" class="onglet" hidden></div>
      </section>
    </main>

    <nav id="barre">
      <button data-onglet="carte" class="seulement-etroit">🗺️<span>Carte</span></button>
      <button data-onglet="segment">🚪<span>Ici</span></button>
      <button data-onglet="perso">🧙<span>Aventurier</span></button>
      <button data-onglet="journal">📜<span>Journal</span></button>
      <button data-onglet="regles">📖<span>Règles</span></button>
      <button data-onglet="plus">⚙️<span>Plus</span></button>
    </nav>
  </div>

  <div id="fenetre" class="fenetre" hidden>
    <div class="fenetre-fond"></div>
    <div class="fenetre-boite" role="dialog" aria-modal="true">
      <div id="fenetre-contenu"></div>
    </div>
  </div>

  <input type="file" id="fichier-tables" hidden>
  <input type="file" id="fichier-partie" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
